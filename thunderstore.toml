[config]
schemaVersion = "0.0.1"


[package]
namespace = "SWu"
name = "MoreDuosMod"
versionNumber = "1.0.3"
description = "Adds new Duo Boons to Hades II. Companion mod to BoonEdits (highly recommended)."
websiteUrl = "https://github.com/vegatarianspam-23/MoreDuos---Hades2Mod"
containsNsfwContent = false

[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.119"
LuaENVY-ENVY = "1.2.1"
SGG_Modding-Chalk = "2.1.2"
SGG_Modding-ReLoad = "1.0.3"
SGG_Modding-SJSON = "1.0.3"
SGG_Modding-ModUtil = "4.0.1"
zannc-GodsAPI = "2.1.5"
zannc-Droppable_Gods = "3.0.9"
zerp-HexReroll = "1.0.2"
zerp-MultiDressHelper = "1.0.0"


[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[[build.copy]]
source = "./src"
target = "./plugins"

[[build.copy]]
source = "./data"
target = "./plugins_data"


[publish]
repository = "https://thunderstore.io"
communities = [ "hades-ii", ]

[publish.categories]
hades-ii = [ "mods", "gameplay", "ai-generated", ]
